name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Fetch veltrio-core
        run: ./scripts/fetch-core.sh
        env:
          # veltrio-core is public, so the workflow's own token can read
          # its releases; CORE_RELEASES_TOKEN is used when set.
          GH_TOKEN: ${{ secrets.CORE_RELEASES_TOKEN || github.token }}
      - run: xcodegen generate
      - run: xcodebuild -project Veltrio.xcodeproj -scheme Veltrio -destination "platform=macOS,arch=arm64" test
