name: Veltrio
options:
  bundleIdPrefix: com.veltrio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    # Sparkle update feed and EdDSA public key. Empty = updates off (the
    # menu item stays disabled); scripts/release-macos.sh fills them from
    # VELTRIO_APPCAST_URL and VELTRIO_SPARKLE_PUBLIC_KEY.
    # SIMKL client id (simkl.com/settings/developer). Empty = SIMKL off.
    VELTRIO_SIMKL_CLIENT_ID: ""
    VELTRIO_APPCAST_URL: ""
    VELTRIO_SPARKLE_PUBLIC_KEY: ""
    # Distribution is outside the App Store (built-in torrent engine), so
    # the app is signed with a Developer ID and notarized. Notarization
    # requires the hardened runtime; scripts/release-macos.sh passes the
    # identity and team.
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Veltrio:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - VeltrioTests
        - VeltrioUITests
      # Tests run in English whatever the Mac's language, so localized
      # strings compare the same everywhere.
      commandLineArguments:
        "-AppleLanguages (en)": true
    sources:
      - path: Veltrio
      # VeltrioKit: the services, theme and translations the iOS app
      # (veltrio-ios, which has this repository as a submodule) builds too.
      - path: Shared
        group: VeltrioKit
      - path: Generated/Bindings/veltrio.swift
        group: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veltrio.Veltrio
        INFOPLIST_FILE: Veltrio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Bindings
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated/Bindings
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Generated/Lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Veltrio/Veltrio.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: GL_SILENCE_DEPRECATION=1 OPENGL_SILENCE_DEPRECATION=1
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      # libmpv + FFmpeg and friends, prebuilt for macOS 12+ (arm64 and
      # x86_64). The LGPL build: the GPL one would put the whole app
      # under the GPL when distributed.
      - package: MPVKit
        product: MPVKit
      - package: Sparkle
      # The Rust core, as a universal dylib (see veltrio-core's scripts/package-macos.sh for
      # why it isn't static). Embedded in Contents/Frameworks.
      - framework: Generated/Lib/libveltrio_core.dylib
        embed: true
        codeSign: true
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework

  VeltrioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Veltrio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Veltrio.app/Contents/MacOS/Veltrio
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Bindings

  VeltrioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Veltrio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Veltrio
